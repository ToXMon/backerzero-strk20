name: privacy-prover-cpu-isa-probe

# Prompt 4 verification evidence.
#
# The released transaction-prover image contains AMD-only SSE4a instructions
# (EXTRQ / INSERTQ). On Intel hosts the process dies with SIGILL (exit 132)
# as soon as it opens an HTTP connection to its RPC node, before any request
# is written. This workflow reproduces the CPU dependency on a second,
# independent machine: it reports the runner ISA and then checks whether the
# prover survives a single starknet_proveTransaction attempt against a stub
# JSON-RPC endpoint (no chain data required to trigger the fault).
#
# Interpretation:
#   sse4a present + prover alive  -> fault is host-ISA dependent (AMD required)
#   sse4a absent  + prover exit 132 -> reproduces the Intel SIGILL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Report runner CPU / ISA
        run: |
          set -euo pipefail
          lscpu | sed -n '1,20p'
          if grep -qm1 sse4a /proc/cpuinfo; then
            echo "SSE4A=present" | tee -a "$GITHUB_ENV"
          else
            echo "SSE4A=absent" | tee -a "$GITHUB_ENV"
          fi

      - name: Read pinned immutable digest
        id: digest
        run: |
          set -euo pipefail
          ref="$(grep -v '^#' scripts/privacy-image-digest.txt | grep -m1 '@sha256:')"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "pinned reference: ${ref}"

      - name: Pull prover by digest
        run: |
          set -euo pipefail
          docker pull "${{ steps.digest.outputs.ref }}"
          docker image inspect "${{ steps.digest.outputs.ref }}" \
            --format 'os={{.Os}} arch={{.Architecture}} entrypoint={{.Config.Entrypoint}}'

      - name: Confirm SSE4a instructions inside the released binary
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends binutils >/dev/null
          cid="$(docker create "${{ steps.digest.outputs.ref }}")"
          docker cp "$cid:/app/target/release/starknet_transaction_prover" ./prover_bin
          docker rm "$cid" >/dev/null
          objdump -d ./prover_bin > prover_bin.asm
          count="$(grep -cE '[[:space:]](extrq|insertq)[[:space:]]' prover_bin.asm || true)"
          echo "sse4a_instruction_count=${count}"
          grep -nE '[[:space:]](extrq|insertq)[[:space:]]' prover_bin.asm | head -20
          rm -f prover_bin prover_bin.asm

      - name: Stub JSON-RPC endpoint
        run: |
          set -euo pipefail
          cat > stub-rpc.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  print("RPC REQUEST:", self.rfile.read(n)[:300].decode(errors="replace"), flush=True)
                  body = b'{"jsonrpc":"2.0","id":1,"error":{"code":-32601,"message":"stub"}}'
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          HTTPServer(("0.0.0.0", 5555), H).serve_forever()
          PY
          nohup python3 stub-rpc.py > stub-rpc.log 2>&1 &
          sleep 2

      - name: Start prover and issue one prove request
        run: |
          set -euo pipefail
          docker run -d --name prover --network host \
            -e RPC_URL=http://127.0.0.1:5555 \
            -e CHAIN_ID=SN_SEPOLIA \
            -e PROVER_PORT=3000 \
            -e RUST_LOG=debug \
            "${{ steps.digest.outputs.ref }}"
          for _ in $(seq 1 40); do
            sleep 2
            if curl -sf -m 5 -X POST http://127.0.0.1:3000 \
                 -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"starknet_specVersion","params":[]}'; then
              echo; break
            fi
          done
          cat > prove.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"starknet_proveTransaction","params":{"block_id":"latest","transaction":{"type":"INVOKE","sender_address":"0x1","calldata":["0x0"],"signature":["0x0","0x0"],"nonce":"0x1","resource_bounds":{"l1_gas":{"max_amount":"0x0","max_price_per_unit":"0x0"},"l2_gas":{"max_amount":"0x100","max_price_per_unit":"0x0"},"l1_data_gas":{"max_amount":"0x0","max_price_per_unit":"0x0"}},"tip":"0x0","paymaster_data":[],"nonce_data_availability_mode":"L1","fee_data_availability_mode":"L1","account_deployment_data":[],"version":"0x3"}}}
          JSON
          echo "--- prove response (may be empty if the process died) ---"
          curl -s -m 120 -X POST http://127.0.0.1:3000 \
            -H 'Content-Type: application/json' -d @prove.json || true
          echo
          echo "--- container state ---"
          docker inspect prover --format 'running={{.State.Running}} exitcode={{.State.ExitCode}} oomkilled={{.State.OOMKilled}}'
          echo "--- prover logs (tail) ---"
          docker logs prover 2>&1 | tail -20
          echo "--- stub rpc saw ---"
          cat stub-rpc.log
          echo "--- kernel traps ---"
          sudo dmesg | grep -i 'trap invalid opcode' | tail -5 || echo "no SIGILL trap recorded"
          echo "SSE4A=${SSE4A}"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f prover >/dev/null 2>&1 || true
          docker image rm -f "${{ steps.digest.outputs.ref }}" >/dev/null 2>&1 || true
